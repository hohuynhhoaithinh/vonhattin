<div style="font-family:Arial,sans-serif;font-size:15px;color:#111;line-height:1.6">
  <h2 style="margin:0 0 12px">{{guest_name}} vừa xác nhận tham dự 🎓</h2>
  <table cellpadding="6" style="border-collapse:collapse">
    <tr><td><b>Tên</b></td><td>{{guest_name}}</td></tr>
    <tr><td><b>Email</b></td><td>{{guest_email}}</td></tr>
    <tr><td><b>Số người</b></td><td>{{guests}}</td></tr>
    <tr><td><b>Lời nhắn</b></td><td>{{message}}</td></tr>
  </table>
  <p style="color:#666;margin-top:16px">Lễ: {{event_date}} lúc {{event_time}} tại {{venue}}.<br>
  Bấm "Trả lời" để nhắn lại cho bạn này.</p>
</div>
